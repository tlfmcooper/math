<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#9b59b6"/>
    </linearGradient>
    <linearGradient id="star32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg32)"/>
  <!-- 8-point star burst -->
  <polygon points="16,4 17.8,10.5 24,9 19.8,13.8 24,18 17.8,17 16,23 14.2,17 8,18 12.2,13.8 8,9 14.2,10.5" fill="url(#star32)" opacity="0.95"/>
  <!-- Bold "1" in center -->
  <text x="16" y="20" font-family="Arial Black, Arial, sans-serif" font-size="10" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle">1</text>
  <!-- Small math dots -->
  <circle cx="5" cy="5" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="27" cy="27" r="1.2" fill="white" opacity="0.5"/>
</svg>
