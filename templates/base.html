<!DOCTYPE html>
<html lang="{{ g.locale }}">

    <title>{% block title %}{{ _('Math Adventure') }}{% endblock %}</title>

    <!-- Theme FOUC prevention — must run before rendering -->
    <script>
        (function(){
            var t = localStorage.getItem('stitchTheme');
            if (t === 'stitch-neon') document.documentElement.setAttribute('data-theme', 'neon');
        })();
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

      theme: {
        extend: {

            "surface":                 "rgb(var(--c-surface) / <alpha-value>)",
            "background":              "rgb(var(--c-background) / <alpha-value>)",
            "on-surface":              "rgb(var(--c-on-surface) / <alpha-value>)",
            "on-background":           "rgb(var(--c-on-background) / <alpha-value>)",
            "primary":                 "rgb(var(--c-primary) / <alpha-value>)",
            "on-primary":              "rgb(var(--c-on-primary) / <alpha-value>)",

            "on-primary-container":    "rgb(var(--c-on-primary-container) / <alpha-value>)",
            "primary-fixed":           "rgb(var(--c-primary-fixed) / <alpha-value>)",
            "primary-fixed-dim":       "rgb(var(--c-primary-fixed-dim) / <alpha-value>)",
            "primary-dim":             "rgb(var(--c-primary-dim) / <alpha-value>)",
            "on-primary-fixed":        "rgb(var(--c-on-primary-fixed) / <alpha-value>)",
            "on-primary-fixed-variant": "rgb(var(--c-on-primary-fixed-variant) / <alpha-value>)",
            "secondary":               "rgb(var(--c-secondary) / <alpha-value>)",

            "secondary-dim":           "rgb(var(--c-secondary-dim) / <alpha-value>)",
            "on-secondary-fixed":      "rgb(var(--c-on-secondary-fixed) / <alpha-value>)",
            "on-secondary-fixed-variant": "rgb(var(--c-on-secondary-fixed-variant) / <alpha-value>)",
            "tertiary":                "rgb(var(--c-tertiary) / <alpha-value>)",
            "on-tertiary":             "rgb(var(--c-on-tertiary) / <alpha-value>)",
            "tertiary-container":      "rgb(var(--c-tertiary-container) / <alpha-value>)",
            "on-tertiary-container":   "rgb(var(--c-on-tertiary-container) / <alpha-value>)",
            "tertiary-fixed":          "rgb(var(--c-tertiary-fixed) / <alpha-value>)",
            "tertiary-fixed-dim":      "rgb(var(--c-tertiary-fixed-dim) / <alpha-value>)",
            "tertiary-dim":            "rgb(var(--c-tertiary-dim) / <alpha-value>)",

            "error":                   "rgb(var(--c-error) / <alpha-value>)",
            "on-error":                "rgb(var(--c-on-error) / <alpha-value>)",

            "surface-container-low":   "rgb(var(--c-surface-container-low) / <alpha-value>)",
            "surface-container-lowest": "rgb(var(--c-surface-container-lowest) / <alpha-value>)",

            "outline-variant":         "rgb(var(--c-outline-variant) / <alpha-value>)",
            "on-surface-variant":      "rgb(var(--c-on-surface-variant) / <alpha-value>)",
            "surface-tint":            "rgb(var(--c-surface-tint) / <alpha-value>)",

    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Lexend:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

    <!-- App styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- PWA -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#fbf8ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.svg') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/favicon.svg') }}">

    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}bg-surface font-body text-on-surface min-h-screen{% endblock %}">
    {% block body %}{% endblock %}

    <!-- Shared theme switching -->
    <script>
    function setStitchTheme(theme) {
        localStorage.setItem('stitchTheme', theme);
        if (theme === 'stitch-neon') {
            document.documentElement.setAttribute('data-theme', 'neon');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'stitch-neon' ? '#0e0e0e' : '#fbf8ff');
        document.querySelectorAll('[data-theme-choice]').forEach(function(btn) {
            btn.classList.toggle('active', btn.dataset.themeChoice === theme);
        });
    }
    (function() {
        var theme = localStorage.getItem('stitchTheme') || 'stitch-light';
        setStitchTheme(theme);
    })();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
